name: Test & Deploy Pharmaceutical Barcode Scanner

on:
  push:
    branches: [ main ]
    paths: [ 'farmcode_detector/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libzbar-dev

      - name: Install Python dependencies
        run: |
          cd farmcode_detector               # <- aquí
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create minimal test secrets
        run: |
          cd farmcode_detector
          mkdir -p .streamlit
          echo '# Test secrets for CI' > .streamlit/secrets.toml

      - name: Test imports & syntax
        run: |
          cd farmcode_detector
          python -c "
          import streamlit as st; import cv2; import pandas
          print('✅ Imports OK')
          "
          python -m py_compile streamlit_app.py  # o el nombre real de tu script
